<!DOCTYPE html>
<html>
<head>
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<div class="recipe-container">

<h1>{{ page.title }}</h1>

{% if page.image %}
  <img src="{{ page.image | relative_url }}" alt="{{ page.title }}">
{% endif %}

<div class="recipe-columns">

<div>
  <h2>Ingredients</h2>
  {{ content | split: "## Instructions" | first }}
</div>

<div>
  <h2>Instructions</h2>
  {{ content | split: "## Instructions" | last }}
</div>

</div>

</div>

</body>
</html>
