<!DOCTYPE html>
<html>
<head>
  <title>{{ page.title }}</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }
    img {
      width: 100%;
      border-radius: 10px;
    }
    h1 {
      margin-top: 20px;
    }
    .section {
      margin-top: 20px;
    }
  </style>
</head>
<body>

<h1>{{ page.title }}</h1>

{% if page.image %}
  <img src="{{ page.image }}" alt="{{ page.title }}">
{% endif %}

<div class="section">
  {{ content }}
</div>

</body>
</html>
