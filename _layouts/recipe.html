---
layout: default
---

<div class="recipe-page active">

<a class="back-btn"
   href="{{ '/' | relative_url }}">
← Back to all recipes
</a>

<img class="recipe-hero-img"
     src="{{ page.image | relative_url }}"
     alt="{{ page.title }}">

<div class="recipe-header">

<p class="recipe-eyebrow">
{{ page.category }}
</p>

<h1 class="recipe-title">
{{ page.title }}
</h1>

</div>

<div class="recipe-body">

<aside>
  <div class="ingredients-card">

    <div class="ingredients-title">
      Ingredients
    </div>

    {{ page.ingredients }}

  </div>
</aside>

<div class="instructions-section">

<p class="instructions-label">
Instructions
</p>

{{ content }}

</div>

</div>

</div>
