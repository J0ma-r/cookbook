<!DOCTYPE html>
<html>
<head>
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<div class="recipe-container">

<h1>{{ page.title }}</h1>

{% if page.image %}
  <img src="{{ page.image | relative_url }}" alt="{{ page.title }}">
{% endif %}

<div class="recipe-content">
  {{ content }}
</div>

</div>

</body>
</html>
